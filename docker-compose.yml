services:
  postgres:
    image: postgres:15-alpine
    container_name: rubaih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rubaih
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: rubaih
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - rubaih_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubaih -d rubaih"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rubaih_redis
    restart: unless-stopped
    # protected-mode must be off for Docker network peers when no Redis password is set
    command: redis-server --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - rubaih_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rubaih_engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rubaih_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rubaih
      DB_USER: rubaih
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MODE: engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - rubaih_logs:/app/logs
    networks:
      - rubaih_net
    command: python -u rubaih_engine.py

  rubaih_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rubaih_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rubaih
      DB_USER: rubaih
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MODE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host 8010 — avoids conflict with athena-ai-engine on :8000
    # Public phones still use nginx :80
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend:/app
      - rubaih_logs:/app/logs
    networks:
      - rubaih_net
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: rubaih_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      rubaih_api:
        condition: service_healthy
    networks:
      - rubaih_net

volumes:
  pgdata:
  redisdata:
  rubaih_logs:

networks:
  rubaih_net:
    driver: bridge
