# Rubaih — CoinDCX INR-M futures cycle
# Sizing & risk are FRACTIONS of free capital / trade margin — not fixed ₹ amounts.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"
  margin_currency: "INR"
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"
  mode: futures_cycle

  # Fallback only for dry-run. LIVE uses wallet API or RUBAIH_FREE_CAPITAL_INR.
  capital_inr: 1000
  leverage: 10
  usdt_inr: 87

  # Use 50–60% of *available* futures capital per trade
  margin_use_frac: 0.55
  margin_use_max_frac: 0.60

  scan_enabled: true
  # Majors only — do NOT auto-add meme/illiquid pairs (CHIP etc.)
  scan_pairs:
    - B-BTC_USDT
    - B-ETH_USDT
    - B-SOL_USDT
    - B-BNB_USDT
  scan_fill_extras: false
  scan_max_pairs: 4
  scan_interval_sec: 5

  delta_threshold: 0.0005
  max_delta: 100.0
  max_vega: 100.0
  max_drawdown_pct: 0.15

  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.2
  max_order_size_btc: 2.0
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 75
    momentum_lookback: 24
    entry_move_pct: 0.001
    # Faster exits for majors: TP +2.20% (ROE≈+22% @10x / +11% @5x).
    take_profit_price_pct: 0.022
    # SL −1.10% → TP:SL = 2:1 (ROE≈−11% @10x / −5.5% @5x).
    stop_loss_price_pct: 0.011
    # Legacy fallbacks
    take_profit_pct: 0.022
    stop_loss_pct: 0.011
    # CoinDCX INR-M 422s on attached TP/SL — bot exits only
    exchange_attach_tpsl: false
    # 0 disables time exits. Hold until TP, SL, max-loss, or profitable trail.
    max_hold_sec: 0
    allow_short: false
    # Above −1.1% @10x (~11% ROE) so soft SL hits first.
    max_loss_frac: 0.12
    # Arm trail after 0.5R (fee-safe) so winners can lock earlier than full TP.
    trail_arm_r: 0.5
    trail_giveback_r: 0.4
    trail_giveback_of_peak: 0.25
risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 5

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
