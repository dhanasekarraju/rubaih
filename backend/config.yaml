# Rubaih Configuration — CoinDCX INR-M Futures Cycle Bot
# Sized for ~₹1000 free futures margin (micro account).
# Ignores other pairs (e.g. locked SLX). Live only when LIVE_TRADING=true.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  # INR-margined futures (prices still quoted in USDT)
  margin_currency: "INR"

  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"

  # flat → buy → sell cycle (not options / not pure delta-hedge)
  mode: futures_cycle

  # Account sizing — ₹1000 INR margin wallet
  capital_inr: 1000
  leverage: 10                   # Needed so ~0.001 BTC min can fit in ₹1k
  usdt_inr: 87                   # Sizing FX only
  margin_buffer: 0.7             # Use 70% of capital for margin estimate

  # Delta limits (also cap absolute position size in cycle mode)
  delta_threshold: 0.0005
  max_delta: 0.002               # Kill if exposure > ~2 min lots
  max_vega: 100.0
  max_drawdown_pct: 0.15         # Halt on ~15% HWM drawdown

  min_hedge_interval_sec: 60
  cost_buffer_multiplier: 1.2

  # Stay at / near exchange minimum lot
  max_order_size_btc: 0.001
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 120
    momentum_lookback: 30        # price samples (~2s poll → ~1 min)
    entry_move_pct: 0.0015       # 0.15% up to enter long
    take_profit_pct: 0.004       # 0.4%
    stop_loss_pct: 0.003         # 0.3%
    max_hold_sec: 1800           # 30 min
    allow_short: false
    position_size_btc: 0.001

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 3

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
