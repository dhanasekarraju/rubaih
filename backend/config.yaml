# Rubaih Configuration — CoinDCX INR-M Futures Cycle Bot
# Multi-pair scanner sized for ~₹5000 free futures margin.
# Ignores locked books (e.g. SLX). Live only when LIVE_TRADING=true.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  margin_currency: "INR"
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"
  mode: futures_cycle

  # Keep each trade small — never eat most of the wallet on one coin
  capital_inr: 5000
  target_margin_inr: 1200
  max_margin_inr: 1500
  leverage: 10
  usdt_inr: 87
  margin_buffer: 0.85

  scan_enabled: true
  scan_pairs:
    - B-BTC_USDT
    - B-ETH_USDT
    - B-SOL_USDT
  scan_max_pairs: 20
  scan_interval_sec: 5

  delta_threshold: 0.0005
  max_delta: 100.0
  max_vega: 100.0
  max_drawdown_pct: 0.15

  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.2
  max_order_size_btc: 2.0
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 90
    momentum_lookback: 24
    entry_move_pct: 0.0012
    # Locked at buy as absolute prices (also % checks)
    take_profit_pct: 0.004
    stop_loss_pct: 0.0025
    # Hard INR stop — sell if loss reaches this (before liquidation)
    max_loss_inr: 200
    max_hold_sec: 1200
    allow_short: false
    # Trail: arm after ₹100 peak profit; sell if giveback ≥ ₹50
    profit_trail_giveback_inr: 50
    profit_trail_arm_inr: 100

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 5

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
