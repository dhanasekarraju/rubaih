# Rubaih Configuration — CoinDCX Futures Delta-Hedge Bot
# Sized for ~₹1000 INR-M capital (micro account).
# Note: BTC mins are large vs ₹1k — keep leverage modest and sizes at exchange min.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  # INR-margined futures (prices still quoted in USDT)
  margin_currency: "INR"

  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"

  # Account sizing — ₹1000 INR margin wallet
  capital_inr: 1000
  leverage: 5                    # Needed so min BTC size can fit; still careful

  # Delta in BTC units — micro: 0.001 BTC ≈ one typical min lot
  delta_threshold: 0.0005
  max_delta: 0.002               # Kill if exposure > ~2 min lots
  max_vega: 100.0
  max_drawdown_pct: 0.15         # ~₹150 session DD halt (small book = noisy)

  min_hedge_interval_sec: 60
  cost_buffer_multiplier: 1.2

  # Stay at / near exchange minimum lot
  max_order_size_btc: 0.001
  twap_slices: 1
  twap_interval_sec: 5

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 3

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
