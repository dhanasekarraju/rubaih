# Rubaih Configuration — CoinDCX Futures Delta-Hedge Bot
# Sized for ~600 USDT live capital (conservative).

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  # Futures margin mode: USDT or INR
  margin_currency: "USDT"

  # Fee structure (fractions — CoinDCX futures typically ~0.025% / 0.075%)
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"

  # Account sizing — ~600 USDT margin
  capital_usdt: 600
  leverage: 2                    # Keep low on small capital (liq risk)

  # Delta hedge parameters (BTC units @ ~$65k → 0.005 BTC ≈ $325 notional)
  delta_threshold: 0.002         # Hedge when |delta| exceeds this
  max_delta: 0.01                # Hard kill ~$650 notional (~1x capital)
  max_vega: 500.0
  max_drawdown_pct: 0.08         # Halt after ~8% session drawdown (~$48)

  # Cost-aware rebalancing
  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.5

  # Order sizing — never put most of the book in one shot
  # 0.004 BTC ≈ $260 notional → ~$130 margin at 2x
  max_order_size_btc: 0.004
  twap_slices: 2
  twap_interval_sec: 8

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 5

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
