# Rubaih — CoinDCX INR-M futures cycle
# Sizing & risk are FRACTIONS of free capital / trade margin — not fixed ₹ amounts.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"
  margin_currency: "INR"
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"
  mode: futures_cycle

  # Fallback only for dry-run. LIVE uses wallet API or RUBAIH_FREE_CAPITAL_INR.
  capital_inr: 1000
  leverage: 10
  usdt_inr: 87

  # Use 50–60% of *available* futures capital per trade
  margin_use_frac: 0.55
  margin_use_max_frac: 0.60

  scan_enabled: true
  # Majors only — do NOT auto-add meme/illiquid pairs (CHIP etc.)
  scan_pairs:
    - B-BTC_USDT
    - B-ETH_USDT
    - B-SOL_USDT
  scan_fill_extras: false
  scan_max_pairs: 3
  scan_interval_sec: 5

  delta_threshold: 0.0005
  max_delta: 100.0
  max_vega: 100.0
  max_drawdown_pct: 0.15

  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.2
  max_order_size_btc: 2.0
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 75
    momentum_lookback: 24
    entry_move_pct: 0.001
    # Locked at buy. RT taker fees ≈0.15% — TP must clear fees+slippage with room.
    take_profit_pct: 0.012     # +1.2% (~2.4R) — net after fees ~1.0%
    stop_loss_pct: 0.005       # −0.5% = 1R
    max_hold_sec: 1200
    allow_short: false
    # Risk vs THIS trade's margin (dynamic with capital)
    max_loss_frac: 0.10          # cut if loss ≥ 10% of margin used
    trail_arm_r: 1.0             # arm trail after +1R profit
    trail_giveback_r: 0.5        # sell if give back 0.5R from peak (price or ₹)
    trail_giveback_of_peak: 0.20 # or give back 20% of peak unrealized ₹

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 5

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
