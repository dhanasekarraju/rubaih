# Rubaih Configuration — CoinDCX INR-M Futures Cycle Bot
# Multi-pair scanner sized for ~₹5000 free futures margin.
# Ignores locked books (e.g. SLX). Live only when LIVE_TRADING=true.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  # INR-margined futures (prices still quoted in USDT)
  margin_currency: "INR"

  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"   # default / fallback when flat

  # flat → scan → buy → sell cycle
  mode: futures_cycle

  # Account sizing — ₹5000 INR margin wallet; each trade aims ~₹2000 margin
  capital_inr: 5000
  target_margin_inr: 2000
  leverage: 10
  usdt_inr: 87
  margin_buffer: 0.85

  # Multi-pair scanner
  scan_enabled: true
  scan_pairs:
    - B-BTC_USDT
    - B-ETH_USDT
    - B-SOL_USDT
  scan_max_pairs: 20
  scan_interval_sec: 5

  delta_threshold: 0.0005
  # Position size is coin units (ETH can be 0.05+) — do not treat like options delta
  max_delta: 100.0
  max_vega: 100.0
  max_drawdown_pct: 0.15

  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.2

  # Cap per order in coin units (high enough for ETH/SOL lots)
  max_order_size_btc: 2.0
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 90
    momentum_lookback: 24
    entry_move_pct: 0.0012
    # Round-trip taker ~0.15%; TP must clear fees with room
    take_profit_pct: 0.005
    stop_loss_pct: 0.0035
    max_hold_sec: 1800
    allow_short: false

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 3

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
