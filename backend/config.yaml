# Rubaih — CoinDCX INR-M futures cycle
# Sizing & risk are FRACTIONS of free capital / trade margin — not fixed ₹ amounts.
# Capital-survival defaults: scale cleanly from ~₹1k probe → ₹20k+.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"
  margin_currency: "INR"
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  # Default active = ETH (smaller min-lot vs BTC on small capital). Scan still ranks by move.
  underlying: "ETH"
  perp_symbol: "B-ETH_USDT"
  mode: futures_cycle

  # Fallback only for dry-run. LIVE uses wallet API or RUBAIH_FREE_CAPITAL_INR.
  capital_inr: 1000
  leverage: 10
  usdt_inr: 87

  # Hard cap risk per trade — engine never bumps min-lot past max_frac×free
  margin_use_frac: 0.25
  margin_use_max_frac: 0.30

  scan_enabled: true
  # Majors only — ETH first (min-lot friendly). Do NOT auto-add meme/illiquid pairs.
  scan_pairs:
    - B-ETH_USDT
    - B-SOL_USDT
    - B-BNB_USDT
    - B-BTC_USDT
  scan_fill_extras: false
  scan_max_pairs: 4
  scan_interval_sec: 5

  delta_threshold: 0.0005
  max_delta: 100.0
  max_vega: 100.0
  # Tighter probe kill — ~8–10% of account from peak
  max_drawdown_pct: 0.10

  min_hedge_interval_sec: 45
  cost_buffer_multiplier: 1.2
  max_order_size_btc: 2.0
  twap_slices: 1
  twap_interval_sec: 5

  strategy:
    entry_cooldown_sec: 150
    momentum_lookback: 24
    # Raise bar vs noise (was 0.1%)
    entry_move_pct: 0.0025
    # Fee-realistic ~2R: TP +1.40% / SL −0.70% → ROE ≈ +14% / −7% @10x
    take_profit_price_pct: 0.014
    stop_loss_price_pct: 0.007
    # Legacy fallbacks (same as price pct)
    take_profit_pct: 0.014
    stop_loss_pct: 0.007
    # CoinDCX INR-M 422s on attached TP/SL — bot exits only
    exchange_attach_tpsl: false
    # Time stop: 4h — no bagging until soft SL alone
    max_hold_sec: 14400
    allow_short: false
    # Soft max-loss under SL (~7% ROE @10x) so it can fire
    max_loss_frac: 0.08
    # Bank early once fee-safe
    trail_arm_r: 0.35
    trail_giveback_r: 0.30
    trail_giveback_of_peak: 0.25
risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 5

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760
  backup_count: 5
