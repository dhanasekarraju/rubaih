# Rubaih Configuration — CoinDCX Futures Delta-Hedge Bot
# ⚠️  EDUCATIONAL / RESEARCH PURPOSES ONLY. Live trading only — no testnet.

exchange:
  name: "coindcx"
  rest_url: "https://api.coindcx.com"
  public_url: "https://public.coindcx.com"
  ws_url: "https://stream.coindcx.com"

  # Futures margin mode: USDT or INR
  margin_currency: "USDT"

  # Fee structure (fractions — CoinDCX futures typically ~0.025% / 0.075%)
  maker_fee: 0.00025
  taker_fee: 0.00075

trading:
  underlying: "BTC"
  perp_symbol: "B-BTC_USDT"
  leverage: 5

  # Delta hedge parameters
  delta_threshold: 0.05        # BTC units — trigger hedge when |delta| > this
  max_delta: 0.50              # Hard kill-switch limit
  max_vega: 5000.0             # USD per vol point
  max_drawdown_pct: 0.05       # 5% session drawdown → halt

  # Cost-aware rebalancing
  min_hedge_interval_sec: 30
  cost_buffer_multiplier: 1.5  # Only hedge if benefit > 1.5x cost

  # Order sizing — keep small for live capital tests
  max_order_size_btc: 0.25
  twap_slices: 3
  twap_interval_sec: 5

risk:
  kill_switch_on_drawdown: true
  kill_switch_on_delta_limit: true
  kill_switch_on_vega_limit: true
  emergency_flatten: true
  rate_limit_orders_per_sec: 10

api:
  host: "0.0.0.0"
  port: 8000
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_hours: 24
  cors_origins:
    - "*"   # Lock this down in production to your mobile app domain

logging:
  level: "INFO"
  file: "logs/rubaih.log"
  max_bytes: 10485760   # 10MB
  backup_count: 5
